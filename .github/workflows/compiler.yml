name: Verificar compilador

on: [push, pull_request]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-compiler.mjs
